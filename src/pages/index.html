<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Magabys, Pedro, Andre and Madu">
    <title>Sender - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">
<meta name="description" content="Sender é uma rede social que conecta pessoas com interesses em comum.">
<meta name="keywords" content="Sender, rede social, interesses, conexão, comunidade">
</head>
<body>
    
    <!-- ----------- LOGIN ----------- -->

    <h1>Bem-Vindo!</h1>

    <h2>Já possui uma conta?</h2>

   <!-- EMAIL -->
    <div class="borda">
        <input type="email" placeholder="Email">
    </div>

    <!-- SENHA -->
    <div class="borda">
        <div class="interno">
            <input type="password" placeholder="Senha">
            <label class="olho">
                <input type="checkbox">
                <span class="aberto">👁️</span>
                <span class="fechado">🙈</span>
            </label>
        </div>
    </div>


    <a href="">Esqueci minha senha.</a>

    <button class="botao">Entrar</button>

    <p>Não possui uma conta? <a href="cadastro.html">Cadastre-se</a>.</p>

</body>
</html>
