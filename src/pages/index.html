<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender - Login</title>

    <link rel="stylesheet" href="/src/styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">

</head>

<body>

    <div class="topo">
        <h1>Bem-vindo!</h1>
    </div>

    <div class="corpo">
        <h2 class="titulo">Já possui uma conta?</h2>
    </div>
    
    <div class="borda">
        <input type="email" placeholder="Email">
    </div>

    <div class="borda">
        <div class="interno">
            <input type="password" placeholder="Senha">
            <label class="olho">
                <input type="checkbox">
                <span class="aberto">👁️</span>
                <span class="fechado">🙈</span>
            </label>
        </div>
    </div>

    <a href="" class="esqueci">Esqueci minha senha.</a>

    <button class="botao">Entrar</button>

    <p class="cadastro">Não possui uma conta? <a href="cadastro.html">Cadastre-se</a>.</p>

</body>
</html>
