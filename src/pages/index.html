
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sender - Login</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/style.css">

    <script src="../scripts/autenticacao.js" defer></script>
</head>
<body class="autenticacao">

    <main class="tela login">

        <header class="topo">
            <h1>Bem-Vindo!</h1>
        </header>

        <section class="corpo">

            <h2>Já possui uma conta?</h2>

            <form id="login" method="post">

                <div class="borda">
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="E-mail"
                           aria-label="E-mail"
                           autocomplete="email"
                           required>
                </div>

                <div class="borda">
                    <div class="interno">

                        <input type="password"
                               id="senha"
                               name="senha"
                               placeholder="Senha"
                               aria-label="Senha"
                               autocomplete="current-password"
                               required>

                        <button type="button"
                                class="olho"
                                aria-controls="senha"
                                aria-label="Mostrar senha"
                                aria-pressed="false">
                        </button>

                    </div>
                </div>

                <a href="esqueci-senha.html" class="esqueci">
                    Esqueci minha senha.
                </a>

                <button class="botao" type="submit" disabled>
                    Entrar
                </button>

                <p class="aviso" role="status"></p>

            </form>

            <p class="cadastro">
                Não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>.
            </p>

        </section>

    </main>

</body>
</html>
