
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender - Código por SMS</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/style.css">

    <script src="../scripts/autenticacao.js" defer></script>
</head>
<body class="tela-fluxo">

    <main class="cartao">

        <h1>Insira o código</h1>

        <p class="apoio">
            Insira o código de verificação por SMS.
        </p>

        <form id="verificacao" method="post">

            <div class="borda">
                <input class="campo-codigo"
                       type="text"
                       id="codigo"
                       name="codigo"
                       inputmode="numeric"
                       maxlength="6"
                       pattern="[0-9]{6}"
                       autocomplete="one-time-code"
                       placeholder="000000"
                       aria-label="Código de 6 dígitos"
                       required>
            </div>

            <button class="botao" type="submit" disabled>
                Próximo
            </button>

        </form>

        <div class="links-inferiores">

            <p class="reenvio">
                <strong>Não recebeu o código?</strong>
                <span>Reenvio indisponível na demonstração.</span>
            </p>

            <a class="link" href="#">
                Precisa de ajuda? <u>Suporte</u>
            </a>

            <a class="link" href="esqueci-senha.html">
                Usar outro número
            </a>

        </div>

    </main>

</body>
</html>
