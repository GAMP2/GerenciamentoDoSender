
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender - Nova senha</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/style.css">

    <script src="../scripts/autenticacao.js" defer></script>
</head>
<body class="tela-fluxo">

    <main class="cartao">

        <h1>Crie uma nova senha</h1>

        <p class="apoio">
            Escolha uma senha forte que você ainda não usou!
        </p>

        <form id="novaSenha" method="post">

            <label class="rotulo" for="senha">
                Nova senha
            </label>

            <div class="borda">
                <div class="interno">

                    <input type="password"
                           id="senha"
                           name="senha"
                           placeholder="Digite sua nova senha"
                           autocomplete="new-password"
                           minlength="8"
                           required>

                    <button type="button"
                            class="olho"
                            aria-controls="senha"
                            aria-label="Mostrar senha"
                            aria-pressed="false">
                    </button>

                </div>
            </div>

            <label class="rotulo" for="confirmarSenha">
                Confirmar nova senha
            </label>

            <div class="borda">
                <div class="interno">

                    <input type="password"
                           id="confirmarSenha"
                           name="confirmarSenha"
                           placeholder="Repita a nova senha"
                           autocomplete="new-password"
                           minlength="8"
                           required>

                    <button type="button"
                            class="olho"
                            aria-controls="confirmarSenha"
                            aria-label="Mostrar senha"
                            aria-pressed="false">
                    </button>

                </div>
            </div>

            <p class="dica">
                Use pelo menos 8 caracteres.
            </p>

            <button class="botao" type="submit" disabled>
                Próximo
            </button>

        </form>

        <div class="links-inferiores">

            <a class="link" href="index.html">
                Voltar ao início
            </a>

            <a class="link" href="#">
                Precisa de ajuda? <u>Suporte</u>
            </a>

        </div>

    </main>

</body>
</html>
