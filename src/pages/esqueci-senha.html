
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sender - Esqueci a senha</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/style.css">

    <script src="../scripts/autenticacao.js" defer></script>
</head>
<body class="tela-fluxo">

    <main class="cartao">

        <h1>Esqueceu a senha?</h1>

        <p class="apoio">
            Digite seu e-mail ou telefone e enviaremos um código para redefinir.
        </p>

        <form id="recuperacao" method="post">

            <div class="borda">

                <input type="text"
                       id="identificador"
                       name="identificador"
                       placeholder="E-mail ou telefone"
                       autocomplete="username"
                       aria-label="E-mail ou telefone"
                       required>

            </div>

            <button class="botao" type="submit" disabled>
                Próximo
            </button>

        </form>

        <div class="links-inferiores">

            <a class="link" href="index.html">
                Voltar ao <u>início</u>
            </a>

            <a class="link" href="#">
                Precisa de ajuda? <u>Suporte</u>
            </a>

        </div>

    </main>

</body>
</html>
