
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender - Interesses</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="autenticacao">

    <main class="tela onboarding">

        <header class="topo"></header>

        <section class="corpo">

            <h1>Quais são seus interesses?</h1>

            <p class="apoio">
                Escolha aqueles que te definem, queremos saber mais sobre você!
            </p>

            <label class="rotulo" for="pesquisa">
                Pesquise seus interesses
            </label>

            <div class="borda">
                <input type="search"
                       id="pesquisa"
                       placeholder="Pesquisar interesses...">
            </div>

            <p class="rotulo">
                Escolha no máximo cinco.
            </p>

            <div class="interesses">

                <button class="interesse" type="button">📖 Leitura</button>
                <button class="interesse" type="button">🏃 Esportes</button>
                <button class="interesse" type="button">🎵 Música</button>
                <button class="interesse" type="button">🎮 Jogos</button>
                <button class="interesse" type="button">💻 Programação</button>
                <button class="interesse" type="button">🎨 Arte</button>
                <button class="interesse" type="button">💃 Dança</button>
                <button class="interesse" type="button">🎬 Filmes</button>
                <button class="interesse" type="button">✍️ Escrita</button>
                <button class="interesse" type="button">👾 Anime</button>
                <button class="interesse" type="button">🍕 Gastronomia</button>
                <button class="interesse" type="button">📷 Fotografia</button>
                <button class="interesse" type="button">🐾 Animais</button>

            </div>

            <p class="dica" id="contador">
                0 de 5 selecionados
            </p>

            <a class="voltar" href="faltapouco.html">
                ← Voltar para a etapa anterior.
            </a>

            <a class="botao" href="bemvindo.html">
                Preparar feed...
            </a>

        </section>

    </main>

    <script src="../scripts/interesses.js"></script>

</body>
</html>
