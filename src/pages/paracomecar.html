<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender - Para começar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Parte de introdução -->
    <h1>Para começar</h1>
    <p>Essa informações você poderá mudar a qualquer momento após o cadastro.</p>

    <!-- Parte de escolha de nickname -->
    <h2>Digite seu nickname</h2>
     <div class="borda">
        <input type="text" placeholder="Nickname">
    </div>

<!-- Parte de escolha de nome de usuário -->
    <h2>Como deseja ser chamado?</h2>
    <div class="borda">
        <input type="text" placeholder="Nome de Usuário">
    </div>

    <!-- Parte de escolha de gênero -->
    <h2> Qual gênero você se identifica?</h2>
    <div class="borda">
        <select name="genero" id="genero">
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
        
        </select>
    </div>

    <button class="button">Continuar...</button>


    
</body>
</html>
