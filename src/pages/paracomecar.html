
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender - Para começar</title>

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body class="autenticacao">

    <main class="tela onboarding">

        <header class="topo"></header>

        <section class="corpo">

            <h1>Para começar...</h1>

            <p class="apoio">
                Essas informações você poderá mudar a qualquer momento após o cadastro.
            </p>

            <form id="dadosPerfil" method="post">

                <label class="rotulo" for="nickname">
                    Digite seu nickname
                </label>

                <div class="borda">
                    <input type="text"
                           id="nickname"
                           name="nickname"
                           placeholder="Nickname"
                           required>
                </div>

                <label class="rotulo" for="nomeUsuario">
                    Como deseja ser chamado?
                </label>

                <div class="borda">
                    <input type="text"
                           id="nomeUsuario"
                           name="nomeUsuario"
                           placeholder="Nome de usuário"
                           required>
                </div>

                <label class="rotulo" for="genero">
                    Qual gênero você se identifica?
                </label>

                <div class="borda">
                    <select name="genero" id="genero" required>
                        <option value="">Selecione</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="outro">Outro</option>
                        <option value="naoInformar">Prefiro não informar</option>
                    </select>
                </div>

                <button class="botao" type="submit">
                    Continuar...
                </button>

            </form>

        </section>

    </main>

    <script>

        document.getElementById('dadosPerfil').addEventListener('submit', function (evento) {

            evento.preventDefault();

            window.location.href = 'faltapouco.html';

        });

    </script>

</body>
</html>
