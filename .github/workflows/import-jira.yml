name: Import Jira Issues
on:
  workflow_dispatch:
    inputs:
      jira_project_key:
        description: 'Jira Project Key (ex: KAN)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Debug Jira Connection
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          python << 'EOF'
          import os
          import requests

          JIRA_URL = os.getenv('JIRA_URL').rstrip('/')
          JIRA_USER = os.getenv('JIRA_USER')
          JIRA_TOKEN = os.getenv('JIRA_TOKEN')
          auth = (JIRA_USER, JIRA_TOKEN)

          print(f"Testando conexão com: {JIRA_URL}")

          # Teste 1: /myself
          for endpoint in ['/rest/api/3/myself', '/rest/api/2/myself', '/rest/api/latest/myself']:
              url = f'{JIRA_URL}{endpoint}'
              try:
                  r = requests.get(url, auth=auth, timeout=10)
                  print(f"  {endpoint}: {r.status_code}")
                  if r.status_code == 200:
                      print(f"    OK: {r.json().get('displayName', 'N/A')}")
                      break
              except Exception as e:
                  print(f"  {endpoint}: ERRO - {e}")

          # Teste 2: buscar projetos
          for endpoint in ['/rest/api/3/project', '/rest/api/2/project']:
              url = f'{JIRA_URL}{endpoint}'
              try:
                  r = requests.get(url, auth=auth, timeout=10)
                  print(f"  {endpoint}: {r.status_code}")
                  if r.status_code == 200:
                      projects = [p['key'] for p in r.json()]
                      print(f"    Projetos: {', '.join(projects[:10])}")
                      break
              except Exception as e:
                  print(f"  {endpoint}: ERRO - {e}")

          # Teste 3: search com JQL simples
          for endpoint in ['/rest/api/3/search', '/rest/api/2/search', '/rest/api/latest/search']:
              url = f'{JIRA_URL}{endpoint}'
              try:
                  r = requests.get(url, auth=auth, params={'jql': 'project = KAN', 'maxResults': 1}, timeout=10)
                  print(f"  {endpoint} (search): {r.status_code}")
                  if r.status_code == 200:
                      print(f"    Total: {r.json().get('total', 0)}")
                      break
                  else:
                      print(f"    Response: {r.text[:200]}")
              except Exception as e:
                  print(f"  {endpoint} (search): ERRO - {e}")

          EOF