name: Java CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build e Testes

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: demo/pom.xml

      - name: Verificar versão do Java
        run: java -version

      - name: Verificar versão do Maven
        working-directory: demo
        run: ./mvnw --version

      - name: Compilar e executar testes
        working-directory: demo
        run: ./mvnw clean verify