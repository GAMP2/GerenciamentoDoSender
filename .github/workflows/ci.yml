name: CI (branch madu)


on:
  push:
    branches:
      - madu
  pull_request:
    branches:
      - main
      - madu
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-madu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build e testes (Java 25 + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: demo

    # O application.properties principal aponta para MySQL em localhost:3306
    # e lê DB_USER / DB_PASSWORD do ambiente, então sobe um MySQL de verdade.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sender
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USER: root
      DB_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sender?useSSL=false&allowPublicKeyRetrieval=true